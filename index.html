<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Denta Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Denta Tracker</title>
<style>
:root{color-scheme:dark;--bg:#080b0a;--panel:#111715;--panel2:#17211d;--line:#26342e;--text:#f2f7f4;--muted:#91a39a;--green:#19c37d;--green2:#0d8f5b;--red:#ed7777;--amber:#d6b46b;--shadow:0 12px 30px #0005}
[data-theme="light"]{color-scheme:light;--bg:#f4f7f5;--panel:#fff;--panel2:#edf4f0;--line:#dce7e0;--text:#17221c;--muted:#687a70;--green:#078b55;--green2:#0b7048;--red:#c74f4f;--amber:#987321;--shadow:0 10px 24px #16352212}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;padding:18px 16px 24px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 20px}.brand{font-size:18px;font-weight:800;letter-spacing:.2px}.brand span{color:var(--green)}.date{font-size:12px;color:var(--muted);margin-top:4px}.avatar{width:38px;height:38px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;color:var(--green);font-weight:800}
h1{font-size:26px;letter-spacing:-.7px;margin:0 0 6px}h2{font-size:18px;margin:0 0 14px}h3{font-size:14px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.hero{background:linear-gradient(145deg,#10251b,#111715 70%);border:1px solid #24543d}.hero .muted{color:#a4c4b2}[data-theme="light"] .hero{background:linear-gradient(145deg,#e0f5e9,#fff 80%);border-color:#b9e3cb}.hero-number{font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:8px 0 2px}.hero-number small{font-size:15px;color:var(--muted);letter-spacing:0}.progress{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden;margin:12px 0 8px}.progress i{display:block;height:100%;background:var(--green);border-radius:9px;width:0}.metric{font-size:27px;font-weight:800;margin:7px 0 2px}.metric small{font-size:12px;font-weight:500;color:var(--muted)}.metric-head{display:flex;justify-content:space-between;align-items:center}.ico{color:var(--green);font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill,.primary,.secondary,.danger{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:10px 12px;font-size:13px;font-weight:650}.pill:active,.primary:active{transform:scale(.98)}.primary{background:var(--green);color:#04130c;border-color:var(--green)}.secondary{background:transparent}.danger{color:var(--red)}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.meal{padding:13px 0;border-top:1px solid var(--line)}.meal:first-of-type{border-top:0}.meal-name{font-weight:700}.meal-entry{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:13px;border-radius:13px;outline:none}.field input:focus{border-color:var(--green)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:var(--green)}.hidden{display:none!important}.section{margin-bottom:18px}.notice{border-radius:14px;padding:12px;background:var(--panel2);color:var(--muted);font-size:12px;line-height:1.5}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 5px;border-bottom:1px solid var(--line);text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted);font-weight:600}.good{color:var(--green)}.bad{color:var(--red)}.empty{text-align:center;padding:26px 10px;color:var(--muted)}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--muted);border:1px solid transparent}.day.today{border-color:var(--green);color:var(--green)}.day.selected{background:var(--green);color:#06150d}.day.has{position:relative}.day.has:after{content:"";width:4px;height:4px;background:var(--green);border-radius:50%;position:absolute;bottom:4px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13px;z-index:30;box-shadow:var(--shadow)}.modal-back{position:fixed;inset:0;background:#0009;z-index:20;display:grid;align-items:end}.modal{background:var(--panel);border-radius:24px 24px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:auto;max-height:88vh;overflow:auto}.modal h2{margin-bottom:16px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions>*{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<nav class="nav hidden" id="nav">
<button data-tab="home" class="active"><b>⌂</b>Главная</button>
<button data-tab="stats"><b>▥</b>Статистика</button>
<button data-tab="calendar"><b>▦</b>Календарь</button>
<button data-tab="settings"><b>⚙</b>Настройки</button>
</nav>
<script>
const KEY='denta-tracker-v1';
const today=()=>new Date().toLocaleDateString('en-CA');
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
let db=load(), tab='home', selectedDate=today(), monthCursor=new Date();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{profile:null,settings:{theme:'dark',body:true,sounds:false,vibration:true},logs:{},favorites:[]}}catch(e){return {profile:null,settings:{theme:'dark',body:true,sounds:false,vibration:true},logs:{},favorites:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function log(date=today()){if(!db.logs[date])db.logs[date]={meals:[],water:0,steps:0,weight:null,measurements:{}};return db.logs[date]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v)||0}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function toast(s){let el=document.getElementById('toastRoot');el.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>el.innerHTML='',2300)}
function applyTheme(){document.documentElement.dataset.theme=db.settings.theme||'dark';document.querySelector('meta[name=theme-color]').content=db.settings.theme==='light'?'#f4f7f5':'#080b0a'}
function render(){applyTheme();if(!db.profile){document.getElementById('nav').classList.add('hidden');renderOnboarding();return}
document.getElementById('nav').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
let p=db.profile,L=log(),target=num(p.calories),waterTarget=num(p.waterTarget),stepsTarget=num(p.stepsTarget),cal=L.meals.reduce((s,m)=>s+num(m.calories),0),remaining=Math.max(0,target-cal);
let app=document.getElementById('app');
if(tab==='home')app.innerHTML=homeHTML(p,L,cal,remaining,waterTarget,stepsTarget);
if(tab==='stats')app.innerHTML=statsHTML();
if(tab==='calendar')app.innerHTML=calendarHTML();
if(tab==='settings')app.innerHTML=settingsHTML(p);
}
function topHTML(){return `<div class="top"><div><div class="brand">DENTA <span>TRACKER</span></div><div class="date">${fmtDate(today())}</div></div><div class="avatar">${esc((db.profile.name||'D').slice(0,1).toUpperCase())}</div></div>`}
function homeHTML(p,L,cal,remaining,wt,st){
let goalText=p.goal==='lose'?'Снижение веса':p.goal==='gain'?'Набор веса':'Поддержание веса';
return `<div class="app">${topHTML()}<div class="section"><div class="muted small">ТВОЯ ЦЕЛЬ · ${goalText.toUpperCase()}</div><h1>Привет, ${esc(p.name)} 👋</h1><div class="muted small">Маленькие шаги каждый день дают результат.</div></div>
<div class="card hero"><div class="row"><span class="muted small">КАЛОРИИ СЕГОДНЯ</span><span class="ico">◉</span></div><div class="hero-number">${cal.toLocaleString('ru-RU')} <small>/ ${num(p.calories).toLocaleString('ru-RU')} ккал</small></div><div class="progress"><i style="width:${pct(cal,p.calories)}%"></i></div><div class="row muted small"><span>Осталось ${remaining.toLocaleString('ru-RU')} ккал</span><span>${pct(cal,p.calories)}%</span></div></div>
<div class="grid">
<div class="card"><div class="metric-head"><span class="muted small">ВОДА</span><span class="ico">◌</span></div><div class="metric">${(L.water/1000).toFixed(2).replace('.',',')}<small> л</small></div><div class="muted small">из ${wt} мл · осталось ${Math.max(0,wt-L.water)} мл</div><div class="progress"><i style="width:${pct(L.water,wt)}%"></i></div><div class="actions">${[300,500,1000].map(v=>`<button class="pill" onclick="addWater(${v})">+${v}</button>`).join('')}</div><button class="secondary wide" style="margin-top:8px" onclick="manualValue('water','Вода, мл',${L.water})">Ввести вручную</button></div>
<div class="card"><div class="metric-head"><span class="muted small">ШАГИ</span><span class="ico">⌁</span></div><div class="metric">${L.steps.toLocaleString('ru-RU')}</div><div class="muted small">из ${st.toLocaleString('ru-RU')} · осталось ${Math.max(0,st-L.steps).toLocaleString('ru-RU')}</div><div class="progress"><i style="width:${pct(L.steps,st)}%"></i></div><div class="actions">${[1000,3000,5000].map(v=>`<button class="pill" onclick="addSteps(${v})">+${v}</button>`).join('')}</div><button class="secondary wide" style="margin-top:8px" onclick="manualValue('steps','Шаги',${L.steps})">Ввести вручную</button></div></div>
<div class="card"><div class="row"><div><div class="muted small">ТЕКУЩИЙ ВЕС</div><div class="metric">${L.weight??p.weight} <small>кг</small></div></div><button class="secondary" onclick="editWeight()">Обновить</button></div><div class="muted small">Цель: ${p.targetWeight} кг · ${Math.abs(num(L.weight??p.weight)-num(p.targetWeight)).toFixed(1)} кг до цели</div></div>
<div class="card"><div class="row"><h2>Дневник питания</h2><button class="primary" onclick="mealModal()">+ Добавить</button></div>${['Завтрак','Обед','Ужин','Перекусы'].map((name,i)=>{let items=L.meals.filter(m=>m.category===name);return `<div class="meal"><div class="row"><span class="meal-name">${name}</span><span class="muted small">${items.reduce((s,m)=>s+num(m.calories),0)} ккал</span></div>${items.map((m,j)=>`<div class="meal-entry"><span>${esc(m.name)}</span><span>${m.calories} ккал <button class="secondary" style="padding:4px 8px;margin-left:5px" onclick="deleteMeal('${m.id}')">×</button></span></div>`).join('')||'<div class="muted small" style="margin-top:7px">Пока ничего не добавлено</div>'}</div>`}).join('')}</div>
<div class="notice">Твои данные сохраняются на этом устройстве. Не забывай периодически создавать резервную копию в настройках.</div></div>`
}
function renderOnboarding(){document.getElementById('app').innerHTML=`<div class="app"><div style="padding:35px 4px 18px"><div class="brand">DENTA <span>TRACKER</span></div><div class="muted small" style="margin-top:6px">ТВОЙ ПУТЬ К БАЛАНСУ</div><h1 style="margin-top:32px">Давай знакомиться</h1><div class="muted">Заполни профиль — и мы настроим твой трекер.</div></div><div class="card"><form id="profileForm">
<div class="field"><label>ТВОЁ ИМЯ</label><input name="name" placeholder="Например, Алекс" required></div>
<div class="form-grid"><div class="field"><label>ПОЛ</label><select name="sex"><option value="female">Женский</option><option value="male">Мужской</option><option value="other">Не указывать</option></select></div><div class="field"><label>ВОЗРАСТ</label><input name="age" type="number" min="13" max="110" placeholder="25" required></div></div>
<div class="form-grid"><div class="field"><label>ТЕКУЩИЙ ВЕС, КГ</label><input name="weight" type="number" step=".1" min="1" placeholder="70" required></div><div class="field"><label>ЖЕЛАЕМЫЙ ВЕС, КГ</label><input name="targetWeight" type="number" step=".1" min="1" placeholder="65" required></div></div>
<div class="field"><label>ТВОЯ ЦЕЛЬ</label><select name="goal"><option value="lose">Снижение веса</option><option value="maintain">Поддержание веса</option><option value="gain">Набор веса</option></select></div>
<div class="form-grid"><div class="field"><label>НОРМА КАЛОРИЙ</label><input name="calories" type="number" min="1" value="2000" required></div><div class="field"><label>ВОДА, МЛ</label><input name="waterTarget" type="number" min="1" value="2000" required></div></div>
<div class="field"><label>НОРМА ШАГОВ</label><input name="stepsTarget" type="number" min="1" value="8000" required></div>
<div class="notice">Нормы можно будет изменить в настройках. Значения по умолчанию — стартовые ориентиры, а не медицинские рекомендации.</div>
<button class="primary wide" style="margin-top:16px" type="submit">Создать мой трекер →</button></form></div></div>`;
document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.profile=Object.fromEntries(f);['age','weight','targetWeight','calories','waterTarget','stepsTarget'].forEach(k=>db.profile[k]=num(db.profile[k]));db.profile.startDate=today();log().weight=db.profile.weight;save();render();toast('Добро пожаловать в Denta Tracker!')}}
function addWater(v){log().water+=v;save();render();}function addSteps(v){log().steps+=v;save();render()}
function manualValue(key,label,current){showModal(`<h2>${label}</h2><div class="field"><label>${label.toUpperCase()}</label><input id="manualInput" type="number" min="0" value="${current}"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="saveManual('${key}')">Сохранить</button></div>`)}
function saveManual(key){let v=num(document.getElementById('manualInput').value);log()[key]=v;save();closeModal();render()}
function editWeight(){showModal(`<h2>Обновить вес</h2><div class="field"><label>ВЕС, КГ</label><input id="weightInput" type="number" step=".1" min="1" value="${log().weight??db.profile.weight}"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="saveWeight()">Сохранить</button></div>`)}
function saveWeight(){let v=num(document.getElementById('weightInput').value);if(v>0){log().weight=v;save();closeModal();render();toast('Вес сохранён')}}
function mealModal(){showModal(`<h2>Добавить приём пищи</h2><div class="field"><label>КАТЕГОРИЯ</label><select id="mealCategory"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекусы</option></select></div><div class="field"><label>НАЗВАНИЕ</label><input id="mealName" placeholder="Например, бутерброд"></div><div class="field"><label>КАЛОРИИ</label><input id="mealCalories" type="number" min="0" placeholder="100"></div><div class="row"><label class="small muted"><input id="makeFavorite" type="checkbox"> В избранное</label><button class="secondary" onclick="favoritesModal()">Выбрать избранное</button></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="saveMeal()">Добавить</button></div>`)}
function saveMeal(){let name=document.getElementById('mealName').value.trim(),cal=num(document.getElementById('mealCalories').value),category=document.getElementById('mealCategory').value;if(!name||cal<0){toast('Заполни название и калории');return}let m={id:crypto.randomUUID(),name,calories:cal,category};log().meals.push(m);if(document.getElementById('makeFavorite').checked&&!db.favorites.some(x=>x.name.toLowerCase()===name.toLowerCase()))db.favorites.push({name,calories:cal});save();closeModal();render()}
function deleteMeal(id){log().meals=log().meals.filter(m=>m.id!==id);save();render()}
function favoritesModal(){let opts=db.favorites.map((f,i)=>`<button class="pill wide" style="margin:4px 0;text-align:left" onclick="chooseFavorite(${i})">${esc(f.name)} · ${f.calories} ккал</button>`).join('');showModal(`<h2>Избранные блюда</h2>${opts||'<div class="empty">Пока нет избранных блюд</div>'}<button class="secondary wide" onclick="mealModal()">Назад</button>`)}
function chooseFavorite(i){let f=db.favorites[i];closeModal();mealModal();setTimeout(()=>{document.getElementById('mealName').value=f.name;document.getElementById('mealCalories').value=f.calories},0)}
function statsHTML(){let dates=Object.keys(db.logs).sort(),yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let yd=yesterday.toLocaleDateString('en-CA');let prev= db.logs[yd]||{};let week=dates.filter(d=>{let diff=(new Date(today())-new Date(d+'T12:00:00'))/86400000;return diff>=1&&diff<=7});let month=dates.filter(d=>d.slice(0,7)===new Date(new Date().setMonth(new Date().getMonth()-1)).toLocaleDateString('en-CA').slice(0,7));function vals(ds,key){let a=ds.map(d=>{let l=db.logs[d];if(key==='calories')return l.meals.reduce((s,m)=>s+num(m.calories),0);return num(l[key])}).filter(x=>x>0);return a.length?(a.reduce((s,v)=>s+v,0)/a.length):null}let rows=[['Вес','weight','кг'],['Калории','calories','ккал'],['Шаги','steps','шагов'],['Вода','water','мл']];return `<div class="app">${topHTML()}<h1>Статистика</h1><div class="muted small" style="margin-bottom:16px">Сравнение по завершённым дням</div><div class="card"><table class="table"><thead><tr><th>Показатель</th><th>Вчера</th><th>7 дней*</th><th>Прошлый месяц</th></tr></thead><tbody>${rows.map(([n,k,u])=>{let y=k==='calories'?(prev.meals||[]).reduce((s,m)=>s+num(m.calories),0):num(prev[k]);let w=vals(week,k),m=vals(month,k);return `<tr><td>${n}</td><td>${y?Math.round(y*10)/10+' '+u:'—'}</td><td>${w?Math.round(w*10)/10+' '+u:'—'}</td><td>${m?Math.round(m*10)/10+' '+u:'—'}</td></tr>`}).join('')}</tbody></table><div class="muted small" style="margin-top:12px">* Среднее за 7 дней до сегодняшнего дня. Если данных нет, показано «—».</div></div><div class="notice"><span class="good">●</span> Вес &nbsp; <span style="color:var(--amber)">●</span> Калории &nbsp; <span style="color:#6ea6ed">●</span> Шаги &nbsp; <span style="color:#b58be8">●</span> Вода</div></div>`}
function calendarHTML(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;let monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});let cells=Array.from({length:offset},()=>'<div></div>').join('');for(let d=1;d<=days;d++){let key=new Date(y,m,d).toLocaleDateString('en-CA'),has=!!db.logs[key],cls=(key===today()?'today ':'')+(key===selectedDate?'selected ':'')+(has?'has':'');cells+=`<button class="day ${cls}" onclick="selectDay('${key}')">${d}</button>`}let l=db.logs[selectedDate];return `<div class="app">${topHTML()}<h1>Календарь</h1><div class="card"><div class="calendar-head"><button class="secondary" onclick="changeMonth(-1)">‹</button><b style="text-transform:capitalize">${monthName}</b><button class="secondary" onclick="changeMonth(1)">›</button></div><div class="days" style="margin-bottom:7px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="muted small" style="text-align:center">${x}</div>`).join('')}</div><div class="days">${cells}</div></div><div class="card"><h2>${fmtDate(selectedDate)}</h2>${l?`<div class="row"><span class="muted">Калории</span><b>${l.meals.reduce((s,x)=>s+num(x.calories),0)} ккал</b></div><div class="row" style="margin-top:10px"><span class="muted">Вода</span><b>${l.water} мл</b></div><div class="row" style="margin-top:10px"><span class="muted">Шаги</span><b>${l.steps}</b></div><div class="row" style="margin-top:10px"><span class="muted">Вес</span><b>${l.weight??'—'} кг</b></div><div class="meal">${l.meals.map(x=>`<div class="meal-entry"><span>${esc(x.category)} · ${esc(x.name)}</span><b>${x.calories} ккал</b></div>`).join('')||'<div class="muted small">Нет записей питания</div>'}</div>`:'<div class="empty">На эту дату пока нет записей</div>'}</div></div>`}
function selectDay(d){selectedDate=d;render()}function changeMonth(v){monthCursor.setMonth(monthCursor.getMonth()+v);render()}
function settingsHTML(p){return `<div class="app">${topHTML()}<h1>Настройки</h1><div class="card"><h2>Профиль и цели</h2><div class="field"><label>ИМЯ</label><input id="sName" value="${esc(p.name)}"></div><div class="form-grid">${[['Вес, кг','weight'],['Целевой вес, кг','targetWeight'],['Калории, ккал','calories'],['Вода, мл','waterTarget'],['Шаги','stepsTarget']].map(([n,k])=>`<div class="field"><label>${n.toUpperCase()}</label><input id="s_${k}" type="number" step="any" value="${p[k]}"></div>`).join('')}</div><div class="field"><label>ЦЕЛЬ</label><select id="sGoal"><option value="lose" ${p.goal==='lose'?'selected':''}>Снижение веса</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Поддержание веса</option><option value="gain" ${p.goal==='gain'?'selected':''}>Набор веса</option></select></div><button class="primary wide" onclick="saveSettings()">Сохранить изменения</button></div>
<div class="card"><h2>Внешний вид и поведение</h2><div class="row"><span>Белая тема</span><input type="checkbox" id="sTheme" ${db.settings.theme==='light'?'checked':''} onchange="toggleTheme(this.checked)"></div><div class="row" style="margin-top:15px"><span>Параметры тела включены</span><input type="checkbox" ${db.settings.body?'checked':''} onchange="db.settings.body=this.checked;save();toast('Настройка сохранена')"></div><div class="row" style="margin-top:15px"><span>Звуки нажатия</span><input type="checkbox" ${db.settings.sounds?'checked':''} onchange="db.settings.sounds=this.checked;save()"></div><div class="row" style="margin-top:15px"><span>Вибрация при нажатии</span><input type="checkbox" ${db.settings.vibration?'checked':''} onchange="db.settings.vibration=this.checked;save()"></div></div>
<div class="card"><h2>Данные и резервная копия</h2><div class="muted small">Начало использования: ${fmtDate(p.startDate)}</div><button class="primary wide" style="margin-top:13px" onclick="backup()">Экспортировать резервную копию</button><label class="secondary wide" style="display:block;text-align:center;margin-top:8px">Импортировать копию<input type="file" accept="application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label><div class="notice" style="margin-top:12px">Резервная копия содержит профиль, дневник, избранные блюда и настройки. Храни файл в надёжном месте.</div></div></div>`}
function saveSettings(){let p=db.profile;p.name=document.getElementById('sName').value.trim()||p.name;['weight','targetWeight','calories','waterTarget','stepsTarget'].forEach(k=>p[k]=num(document.getElementById('s_'+k).value));p.goal=document.getElementById('sGoal').value;save();render();toast('Настройки сохранены')}
function toggleTheme(v){db.settings.theme=v?'light':'dark';save();render()}
function backup(){let blob=new Blob([JSON.stringify({app:'Denta Tracker',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='denta-tracker-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Резервная копия подготовлена')}
function restoreBackup(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!o.data||!o.data.logs)throw 0;if(!confirm('Заменить текущие данные данными из резервной копии?'))return;db=o.data;save();render();toast('Данные восстановлены')}catch(e){toast('Не удалось прочитать файл копии')}};r.readAsText(file)}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
